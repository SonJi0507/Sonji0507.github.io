<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta name="author" content="손지혁">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="canonical" href="{{ canonical }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <a class="skip" href="#content">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-bar">
        <a class="wordmark" href="/">손지혁</a>
        <a class="header-link" href="https://github.com/SonJi0507" rel="me noopener noreferrer">GitHub</a>
      </div>
      <nav class="site-nav" aria-label="주요">
        <a href="/#about"{% if path == "/" %} aria-current="page"{% endif %}>소개</a>
        <a href="/projects/"{% if path.startswith("/projects/") %} aria-current="page"{% endif %}>프로젝트</a>
      </nav>
    </div>
  </header>
  <main id="content">
    {{ body | safe }}
  </main>
  <footer class="site-footer">
    <p><a href="mailto:jhson0507@gmail.com">jhson0507@gmail.com</a> · <a href="https://github.com/SonJi0507" rel="me noopener noreferrer">GitHub</a> · <a href="/assets/portfolio.pdf">PDF 다운로드</a></p>
  </footer>
  <script src="/js/site.js" defer></script>
</body>
</html>
