<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonical }}">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/">Sonji</a>
    <nav aria-label="주요">
      <ul>
        <li><a href="/"{% if path == "/" %} aria-current="page"{% endif %}>홈</a></li>
        <li><a href="/homelab/"{% if path == "/homelab/" %} aria-current="page"{% endif %}>홈서버</a></li>
        <li><a href="/about/"{% if path == "/about/" %} aria-current="page"{% endif %}>소개</a></li>
      </ul>
    </nav>
  </header>
  <main>
    {{ body | safe }}
  </main>
  <footer class="site-footer">
    <p>이 사이트는 GitHub Pages에서 서빙합니다.</p>
  </footer>
</body>
</html>
