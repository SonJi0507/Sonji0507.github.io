<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
  <title id="title">홈서버 구성</title>
  <desc id="desc">방문자는 포트폴리오와 배포된 앱으로 갈라진다. 앱은 터널과 프록시를 거쳐 쿠버네티스로 가고, 데이터는 호스트 컨테이너에 남는다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#d4a574"/>
    </marker>
  </defs>
  <style>
    .panel { fill: #14161c; }
    .box { fill: #1b1e26; stroke: rgba(242,238,230,0.14); stroke-width: 1.2; }
    .box-accent { fill: rgba(212,165,116,0.1); stroke: #d4a574; stroke-width: 1.4; }
    .label { font: 600 14px Pretendard, sans-serif; fill: #f2eee6; }
    .sub { font: 12px Pretendard, sans-serif; fill: #9c968b; }
    .kicker { font: 650 11px Pretendard, sans-serif; fill: #d4a574; letter-spacing: 0.14em; }
    .line { stroke: #d4a574; stroke-width: 1.35; fill: none; marker-end: url(#arrow); }
    .line-soft { stroke: #9c968b; stroke-width: 1.15; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  </style>
  <rect class="panel" x="0" y="0" width="720" height="640" rx="16"/>

  <text class="kicker" x="36" y="38">OUTSIDE</text>
  <rect class="box" x="250" y="54" width="220" height="50" rx="10"/>
  <text class="label" x="360" y="75" text-anchor="middle">방문자</text>
  <text class="sub" x="360" y="92" text-anchor="middle">브라우저</text>

  <path class="line" d="M 300 104 L 180 148"/>
  <path class="line" d="M 420 104 L 540 148"/>

  <rect class="box-accent" x="40" y="152" width="280" height="70" rx="10"/>
  <text class="label" x="180" y="180" text-anchor="middle">이 사이트</text>
  <text class="sub" x="180" y="198" text-anchor="middle">포트폴리오</text>

  <rect class="box" x="400" y="152" width="280" height="70" rx="10"/>
  <text class="label" x="540" y="180" text-anchor="middle">터널</text>
  <text class="sub" x="540" y="198" text-anchor="middle">공유기 포트 없이 공개</text>

  <path class="line" d="M 540 222 L 540 262"/>

  <rect class="box" x="400" y="266" width="280" height="54" rx="10"/>
  <text class="label" x="540" y="288" text-anchor="middle">리버스 프록시</text>
  <text class="sub" x="540" y="306" text-anchor="middle">인증서는 여기서 종료</text>

  <path class="line" d="M 540 320 L 540 360"/>

  <rect class="box" x="400" y="364" width="280" height="54" rx="10"/>
  <text class="label" x="540" y="386" text-anchor="middle">쿠버네티스</text>
  <text class="sub" x="540" y="404" text-anchor="middle">웹앱만 올림</text>

  <path class="line" d="M 540 418 L 540 458"/>

  <rect class="box" x="400" y="462" width="280" height="58" rx="10"/>
  <text class="label" x="540" y="486" text-anchor="middle">배포된 앱</text>
  <text class="sub" x="540" y="504" text-anchor="middle">클러스터 위 워크로드</text>

  <text class="kicker" x="36" y="548">HOST</text>
  <rect class="box" x="40" y="560" width="200" height="52" rx="10"/>
  <text class="label" x="140" y="582" text-anchor="middle">Postgres</text>
  <text class="sub" x="140" y="598" text-anchor="middle">데이터</text>

  <rect class="box" x="260" y="560" width="200" height="52" rx="10"/>
  <text class="label" x="360" y="582" text-anchor="middle">Redis</text>
  <text class="sub" x="360" y="598" text-anchor="middle">캐시</text>

  <rect class="box" x="480" y="560" width="200" height="52" rx="10"/>
  <text class="label" x="580" y="582" text-anchor="middle">파일 저장소</text>
  <text class="sub" x="580" y="598" text-anchor="middle">앱마다 열쇠</text>

  <path class="line-soft" d="M 470 520 L 140 556"/>
  <path class="line-soft" d="M 540 520 L 360 556"/>
  <path class="line-soft" d="M 610 520 L 580 556"/>
</svg>
